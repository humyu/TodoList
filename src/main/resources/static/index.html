<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>待办事项列表 (Todo List)</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
<div class="container">
    <h1>我的待办事项</h1>
    <form class="todo-form">
        <input type="text" class="todo-input" placeholder="今天要做什么？" autocomplete="off">
        <button type="submit">添加</button>
    </form>
    <ul class="todo-list">
        <!-- 待办事项将由 JS 动态插入这里 -->
    </ul>
</div>
<script src="todo.js"></script>
</body>
</html>
